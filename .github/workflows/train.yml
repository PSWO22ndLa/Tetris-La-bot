name: train
on:
  schedule:
    - cron: '17 * * * *'            # 每小時自動跑一次（UTC）；公開 repo 的 Actions 不限分鐘數
  workflow_dispatch:                # 手機 GitHub App → Actions → train → Run workflow
    inputs:
      rounds: { description: '幾輪', default: '6' }
      games: { description: '每個行程幾局', default: '30' }
permissions:
  contents: write
  actions: write
concurrency:
  group: train
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: 產資料 → 訓練 → 比較
        run: |
          ROUNDS=${{ github.event.inputs.rounds || '6' }} GAMES=${{ github.event.inputs.games || '30' }} ./run.sh | tee last_run.txt
      - name: 只留最新 16 份資料（repo 不要越長越大）
        run: |
          ls -1t data/*.json | grep -v 'data/start.json' | tail -n +17 | xargs -r rm -f
          ls -1t hist/* | tail -n +31 | xargs -r rm -f
      - name: 存回 repo
        run: |
          git config user.name 'labot-train'
          git config user.email 'actions@users.noreply.github.com'
          git add -A nn.json data hist last_run.txt
          git commit -m "train: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
      - name: 接著跑下一次（GitHub 的排程常常延遲或漏跑；repo 裡放一個 PAUSE 檔就會停）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f PAUSE ] && { echo '有 PAUSE 檔，不接著跑'; exit 0; }
          gh workflow run train.yml --ref main
