name: train
on:
  schedule:
    - cron: '17 */6 * * *'          # 每 6 小時自動跑一次（UTC）
  workflow_dispatch:                # 手機 GitHub App → Actions → train → Run workflow
    inputs:
      rounds: { description: '幾輪', default: '3' }
      games: { description: '每個行程幾局', default: '30' }
permissions:
  contents: write
concurrency:
  group: train
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: 產資料 → 訓練 → 比較
        run: |
          ROUNDS=${{ github.event.inputs.rounds || '3' }} GAMES=${{ github.event.inputs.games || '30' }} ./run.sh | tee last_run.txt
      - name: 只留最新 16 份資料（repo 不要越長越大）
        run: |
          ls -1t data/*.json | grep -v 'data/start.json' | tail -n +17 | xargs -r rm -f
          ls -1t hist/* | tail -n +31 | xargs -r rm -f
      - name: 存回 repo
        run: |
          git config user.name 'labot-train'
          git config user.email 'actions@users.noreply.github.com'
          git add -A nn.json data hist last_run.txt
          git commit -m "train: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
